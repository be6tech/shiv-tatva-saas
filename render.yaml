# Deploy api-gateway (HRMS) — then set API_GATEWAY_URL on Vercel to the Render service URL.
services:
  - type: web
    name: shivtatva-api-gateway
    runtime: docker
    rootDir: services/api-gateway
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 4000
      # Same Supabase project as Vercel (copy from Vercel env). Run apps/web/supabase/hrms_store.sql first.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
